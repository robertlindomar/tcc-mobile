name: Build APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_url:
        description: "URL pública da API embutida no APK"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url || vars.EXPO_PUBLIC_API_URL || 'https://tccapi.kardapiodigital.com' }}
      NODE_ENV: production
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependências
        run: npm ci

      - name: Identificar build
        run: echo "EXPO_PUBLIC_BUILD_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Gerar projeto nativo (expo prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compilar APK release
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Renomear APK
        id: apk
        run: |
          NOME="conecta-comercio-${GITHUB_SHA::7}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NOME"
          echo "nome=$NOME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.nome }}
          path: ${{ steps.apk.outputs.nome }}

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" "${{ steps.apk.outputs.nome }}" \
            --title "APK #${{ github.run_number }} (${GITHUB_SHA::7})" \
            --notes "API: ${EXPO_PUBLIC_API_URL}" \
            --latest
